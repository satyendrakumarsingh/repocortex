# nginx definitions. Rule:
#  - each server block is a class named by its first server_name; a server block with no server_name is not extracted;
#  - each location block is a function named by its path, as written (the modifier ~ or = is not part of the name);
#  - each upstream NAME block is a class named NAME;
#  - directives, if/map/http/events blocks and comments are not definitions.
http {
    upstream backend_pool {
        server 10.0.0.1:8080;
        server 10.0.0.2:8080;
    }

    server {
        listen 80;
        server_name example.com www.example.com;

        location / {
            root /var/www;
        }

        location = /health {
            return 200;
        }

        location ~* \.(png|jpg)$ {
            expires 30d;
        }
    }

    server {
        listen 8080;

        location /api/v1/ {
            proxy_pass http://backend_pool;
        }
    }

    # server_name commented.example.com; is not a block
    server {
        server_name api.example.org;
        if ($request_method = POST) {
            return 405;
        }
    }
}
