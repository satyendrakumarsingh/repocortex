; INI definitions. Rule:
;  - each [section] is a package named by the section name, without brackets;
;  - keys are not definitions, as in TOML and YAML: a key is a setting;
;  - a key before the first section belongs to no section either;
;  - values, comments and the = separator are not definitions.
global_key = before any section

[database]
host = localhost
port = 5432

[logging.file]
path = /var/log/app.log
# commented_key = no
[ spaced section ]
level=debug
