name: CGO parser backend

# The differential gate for the parser escape hatch.
#
# WHY THIS IS A SEPARATE WORKFLOW, NOT A JOB IN ci.yml
#
# ci.yml's matrix defines what RepoCortex promises to every user: builds and tests
# on three operating systems with no C toolchain, plus five cross-compiled
# release targets at CGO_ENABLED=0. This job is the opposite of that promise —
# it requires a C compiler and builds four tree-sitter grammars from source.
# Mixing it into the default matrix would blur the line the cgo-free job exists
# to draw, and would tempt someone to "fix" a red default matrix by relaxing the
# zero-CGO rule.
#
# It is also SLOW. Compiling the grammar C sources takes minutes on a cold
# cache, where the entire default test job takes well under one. It runs on
# ubuntu-latest only: the differential result is a property of the two runtimes
# and their grammars, not of the host, so paying for it three times buys
# nothing.
#
# THIS JOB IS NOT PART OF THE DEFAULT MATRIX AND MUST NOT BECOME PART OF IT.
# A failure here means the escape hatch has stopped being usable; it does not
# mean RepoCortex is broken for users, all of whom run the pure-Go build.

on:
  push:
    branches: [main]
  pull_request:
    # Only when the seam itself changes. A docs typo should not pay for four
    # grammar compilations.
    paths:
      - "internal/parse/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/cgo-backend.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the same patched release as ci.yml, and for the same reason: the
  # floating "1.25" that used to be here would have silently accepted 1.25.0,
  # which govulncheck reports 28 standard-library vulnerabilities against.
  # Two workflows disagreeing about the toolchain is also how a failure that
  # only reproduces in one of them gets written off as flaky.
  GO_VERSION: "1.25.13"

jobs:
  differential:
    name: purego vs C runtime (slow, not in the default matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }

      # Guards the invariant this workflow could most plausibly break. The CGO
      # backend lives behind a build tag precisely so the default build never
      # sees it, and this proves the tag is doing its job before anything slow
      # runs.
      - name: default build is still CGO-free
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build ./internal/parse/...
          go test -count=1 ./internal/parse/...

      - name: build the CGO backend
        env:
          CGO_ENABLED: "1"
        run: go build -tags cgo_parser ./internal/parse/...

      - name: vet the tagged build
        env:
          CGO_ENABLED: "1"
        run: go vet -tags cgo_parser ./internal/parse/...

      # -v is deliberate and load-bearing. The disagreements between the two
      # backends are this job's entire output; a run that printed only PASS
      # would tell a maintainer nothing about whether the fallback is still
      # worth having.
      - name: differential comparison
        env:
          CGO_ENABLED: "1"
        run: go test -tags cgo_parser -race -count=1 -timeout 20m -v ./internal/parse/
