name: corpus gate

# Nightly, not per-push. The gate clones and indexes the corpus; it is minutes,
# not seconds. Its value is catching drift against code we do not control, which
# does not change on our commits — and the corpus tracks upstream HEAD, so a
# nightly run sees new code even on a day we wrote none.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23', cache: true }

      - name: build
        run: go build -o /tmp/cortex ./cmd/cortex

      # Nine of the corpus's ten members. The tenth is a private application and
      # is measured locally; CI reports nine rather than pretending to ten.
      - name: fetch the corpus
        run: script/corpus-clone.sh /tmp/corpus /tmp/corpus.repos

      - name: gate
        run: script/corpus-gate.sh /tmp/corpus.repos /tmp/cortex

      # The gate leaves an index per repository. On a failure these are the only
      # way to tell which invariant broke on which upstream commit.
      - name: keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-indexes
          path: /tmp/corpus/*/.cortex/index.db
          retention-days: 7
