name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        type: string

# Nothing is granted at the top: each job below asks for exactly what it uses.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.11"
  IMAGE: ghcr.io/satyendrakumarsingh/repocortex

# The order of the jobs is the point of this file.
#
#   release      builds the archives and SHA256SUMS and publishes the GitHub
#                release. It depends on no service except GitHub itself.
#   provenance   signs SHA256SUMS, attests the archives and attaches SBOMs.
#   bundle       builds the MCP bundles (.mcpb) and attaches them.
#   image        builds, pushes, signs and attests the container image.
#   homebrew     opens the formula bump on the tap (releases only).
#
# The last four all `need` release, so they start only once the release
# exists. If Sigstore, GHCR or the Go module proxy is down, the release is
# still out with its checksums; what is missing is the signature, the image or
# the bundle, the failed job is red, and re-running that job alone adds it.
jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true

      - name: Resolve Version and Tag
        id: vars
        shell: bash
        # The ref and the dispatch input reach the script as environment
        # variables, never as text pasted into it: a tag name is chosen by
        # whoever starts the run, and pasted text would be run as shell.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+$ ]]; then
              SEMVER_TAG="$(git tag --points-at HEAD "v*.*.*" 2>/dev/null | head -n1 || echo "")"
              if [ -n "$SEMVER_TAG" ]; then
                VERSION="$SEMVER_TAG"
                TAG_NAME="$SEMVER_TAG"
              else
                VERSION="$GITHUB_REF_NAME"
                TAG_NAME="$GITHUB_REF_NAME"
              fi
            else
              VERSION="$GITHUB_REF_NAME"
              TAG_NAME="$GITHUB_REF_NAME"
            fi
            IS_PRERELEASE="false"
            TITLE="RepoCortex ${VERSION}"
          elif [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
            TAG_NAME="$INPUT_TAG"
            IS_PRERELEASE="false"
            TITLE="RepoCortex ${VERSION}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="canary-${SHORT_SHA}"
            TAG_NAME="canary"
            IS_PRERELEASE="true"
            TITLE="RepoCortex Canary (${SHORT_SHA})"
          fi
          {
            echo "version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "title=${TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Cross-compile Multi-arch Targets and Create Universal Binary
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit=$(git rev-parse HEAD)
          pkg="github.com/satyendrakumarsingh/repocortex/internal/cli"
          ldflags="-s -w -X ${pkg}.Version=${VERSION} -X ${pkg}.Commit=${commit} -X ${pkg}.BuildTime=${build_time}"

          mkdir -p dist

          echo "==> Building darwin/amd64"
          mkdir -p dist/darwin_amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/darwin_amd64/repocortex ./cmd/repocortex
          cp LICENSE NOTICE README.md dist/darwin_amd64/
          tar -czf "dist/repocortex_${VERSION}_darwin_amd64.tar.gz" -C dist/darwin_amd64 repocortex LICENSE NOTICE README.md

          echo "==> Building darwin/arm64"
          mkdir -p dist/darwin_arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o dist/darwin_arm64/repocortex ./cmd/repocortex
          cp LICENSE NOTICE README.md dist/darwin_arm64/
          tar -czf "dist/repocortex_${VERSION}_darwin_arm64.tar.gz" -C dist/darwin_arm64 repocortex LICENSE NOTICE README.md

          echo "==> Creating universal macOS binary (repocortex-mac.zip)"
          sudo apt-get update && sudo apt-get install -y llvm zip
          mkdir -p dist/universal_mac
          llvm-lipo -create -output dist/universal_mac/repocortex dist/darwin_amd64/repocortex dist/darwin_arm64/repocortex
          cp LICENSE NOTICE README.md dist/universal_mac/
          (cd dist/universal_mac && zip -qr "../repocortex-mac.zip" repocortex LICENSE NOTICE README.md)

          echo "==> Building linux/amd64"
          mkdir -p dist/linux_amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/linux_amd64/repocortex ./cmd/repocortex
          cp LICENSE NOTICE README.md dist/linux_amd64/
          tar -czf "dist/repocortex_${VERSION}_linux_amd64.tar.gz" -C dist/linux_amd64 repocortex LICENSE NOTICE README.md

          echo "==> Building linux/arm64"
          mkdir -p dist/linux_arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o dist/linux_arm64/repocortex ./cmd/repocortex
          cp LICENSE NOTICE README.md dist/linux_arm64/
          tar -czf "dist/repocortex_${VERSION}_linux_arm64.tar.gz" -C dist/linux_arm64 repocortex LICENSE NOTICE README.md

          echo "==> Building windows/amd64"
          mkdir -p dist/windows_amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/windows_amd64/repocortex.exe ./cmd/repocortex
          cp LICENSE NOTICE README.md dist/windows_amd64/
          (cd dist/windows_amd64 && zip -qr "../repocortex_${VERSION}_windows_amd64.zip" repocortex.exe LICENSE NOTICE README.md)
          cp dist/windows_amd64/repocortex.exe dist/repocortex.exe

          rm -rf dist/darwin_amd64 dist/darwin_arm64 dist/universal_mac dist/linux_amd64 dist/linux_arm64 dist/windows_amd64

          echo "==> Generating SHA256 checksums"
          # Every name here starts with "repocortex", so none can be read as an
          # option. The names must stay bare: installers and package managers
          # look an archive up in SHA256SUMS by its exact file name.
          # shellcheck disable=SC2035
          (cd dist && shasum -a 256 *.tar.gz *.zip *.exe > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Verify Version Stamp
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: ./script/verify-stamp.sh "$VERSION"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: repocortex-release-${{ steps.vars.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/repocortex.exe
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/repocortex.exe
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Signature, provenance and SBOMs for what the release job just published.
  # Runs for the canary too: it is the same code path a tag takes, so a push to
  # main is what shows it still works before a tag depends on it.
  provenance:
    name: Sign, Attest & SBOM
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach the signature bundle and the SBOMs to the release
      id-token: write # the OIDC token Sigstore exchanges for a signing certificate
      attestations: write # store the build-provenance attestations
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The same files the release job uploaded, byte for byte: the artifact is
      # that job's dist/ directory. Nothing is rebuilt here, so what gets
      # signed and attested is what users download.
      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: repocortex-release-${{ needs.release.outputs.version }}
          path: dist

      - name: Check Artifacts Against SHA256SUMS
        id: check
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      # Every step from here on runs whether or not the one before it worked,
      # as long as the artifacts are intact. A Sigstore outage must not cost
      # the release its SBOMs, nor the other way round. The job still ends red
      # if any of them fails, which is the signal to re-run it.

      - name: Setup Go Environment
        id: go
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Generate SBOMs (CycloneDX)
        id: sbom
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release/sbom.sh "$VERSION" dist sbom

      # Not for the canary. Its assets carry the commit in their names, so
      # softprops never replaces them and the canary release already keeps
      # every archive it was ever given; five more files per push to main
      # would only add to that. The canary still generates the SBOMs above,
      # which is the part that can break.
      - name: Attach SBOMs to the Release
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' && needs.release.outputs.is_prerelease == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" sbom/*.cdx.json --clobber

      # Pinned to a full version: cosign-installer publishes no moving v4 tag.
      - name: Install cosign
        id: cosign
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate names this workflow file and ref, and the
      # signature is recorded in the public Rekor log. There is no key to keep.
      - name: Sign SHA256SUMS
        if: ${{ !cancelled() && steps.cosign.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS
          gh release upload "$TAG_NAME" dist/SHA256SUMS.sigstore.json --clobber

      - name: Attest Build Provenance (archives)
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/repocortex.exe

      - name: Attest Build Provenance (SBOMs)
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' && needs.release.outputs.is_prerelease == 'false' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sbom/*.cdx.json

  # One .mcpb per platform, built from the archives above. Releases only: the
  # bundle manifest needs a semantic version, which a canary does not have.
  bundle:
    name: MCP Bundles
    needs: release
    if: ${{ needs.release.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the bundles to the release
      id-token: write # the OIDC token Sigstore exchanges for a signing certificate
      attestations: write # store the build-provenance attestation
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: repocortex-release-${{ needs.release.outputs.version }}
          path: dist

      - name: Build MCP Bundles
        id: build
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          ./scripts/release/build-mcpb.sh "$VERSION" dist mcpb

      - name: Attach MCP Bundles to the Release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" mcpb/*.mcpb mcpb/MCPB_SHA256SUMS --clobber

      - name: Attest Build Provenance (bundles)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: mcpb/*.mcpb

  # The Homebrew formula lives in satyendrakumarsingh/homebrew-tap. It used to
  # be edited by hand, and after v1.0.1 it still installed v1.0.0 under the
  # old `cortex` name. This job renders it from the release's SHA256SUMS and
  # opens a pull request on the tap; merging that PR is what publishes it.
  # It needs HOMEBREW_TAP_TOKEN, a token that may push branches to the tap
  # and open pull requests there. Without it the job says so and succeeds:
  # the release is out either way.
  homebrew:
    name: Homebrew Formula
    needs: release
    if: ${{ needs.release.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      TAP: satyendrakumarsingh/homebrew-tap
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: repocortex-release-${{ needs.release.outputs.version }}
          path: dist

      - name: Render the Formula
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          ./scripts/release/render-homebrew-formula.sh "$TAG_NAME" dist/SHA256SUMS > repocortex.rb
          ruby -c repocortex.rb

      - name: Open the Bump on the Tap
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the formula was rendered and not published. Copy packaging/homebrew/repocortex.rb to the tap by hand."
            exit 0
          fi
          branch="repocortex-${TAG_NAME}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" tap
          cd tap
          git checkout -b "$branch"
          mkdir -p Formula
          cp ../repocortex.rb Formula/repocortex.rb
          # The formula was called cortex before v1.0.1; the rename file makes
          # `brew upgrade` move existing installs to the new name.
          if [ -f Formula/cortex.rb ]; then
            git rm -q Formula/cortex.rb
          fi
          echo '{ "cortex": "repocortex" }' > formula_renames.json
          git add Formula/repocortex.rb formula_renames.json
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "repocortex ${TAG_NAME}"
          git push -q --force origin "$branch"
          if gh pr view "$branch" --repo "$TAP" >/dev/null 2>&1; then
            echo "The pull request for ${branch} is already open; its branch was updated."
          else
            gh pr create --repo "$TAP" --head "$branch" --base main \
              --title "repocortex ${TAG_NAME}" \
              --body "Formula rendered from the ${TAG_NAME} SHA256SUMS by the release workflow."
          fi

  # The container image. Pushed for a tag and nothing else: a canary image
  # would be one more thing called "latest" that is not a release.
  image:
    name: Container Image
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
      id-token: write # the OIDC token Sigstore exchanges for a signing certificate
      attestations: write # store the build-provenance attestation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 1.2.3 gets :1.2.3, :1.2 and :latest. A pre-release such as 1.3.0-rc1
      # gets only its own tag, so it never becomes what `docker pull` returns
      # by default.
      - name: Resolve Image Tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tags="${IMAGE}:${version}"
          case "$version" in
            *-*) ;;
            *) tags="${tags},${IMAGE}:${version%.*},${IMAGE}:latest" ;;
          esac
          {
            echo "tags=${tags}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # No QEMU step. The Dockerfile compiles on the runner's own architecture
      # and cross-compiles for the target, and its final stage only copies
      # files, so nothing in the arm64 image is ever executed during the build.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log In to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance and sbom are BuildKit's own attestations. They are off so
      # the image has one provenance statement, the GitHub one below, and so
      # the manifest list holds two platforms rather than two platforms plus
      # two "unknown/unknown" entries.
      - name: Build and Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Install cosign
        id: cosign
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signed by digest, never by tag: a tag can be moved after signing.
      - name: Sign the Image
        if: ${{ !cancelled() && steps.cosign.outcome == 'success' }}
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # create-storage-record is an organisation-only API; this repository
      # belongs to a user account, so it is switched off rather than left to
      # be skipped at run time.
      - name: Attest Build Provenance (image)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
