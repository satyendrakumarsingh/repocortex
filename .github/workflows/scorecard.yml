name: OpenSSF Scorecard

# Scorecard grades the repository's supply-chain posture from the outside:
# branch protection, pinned actions, signed releases, dependency update
# policy. It is the one signal here that RepoCortex does not author itself.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
